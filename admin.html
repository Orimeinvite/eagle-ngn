<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eagle NGN Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--navy:#0b2f66;--blue:#1565c0;--green:#15803d;--red:#b91c1c;--mute:#4a5f80}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--navy);background:#e8f1fc;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:22px;margin:4px 0 12px}
h3{margin:0 0 8px;font-size:17px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(5,40,100,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.grid b{display:block;font-size:20px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.full{width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;color:#fff;background:var(--blue);min-height:44px}
button.g{background:var(--green)}
button.r{background:var(--red)}
button:disabled{opacity:.55}
input,textarea{width:100%;font:inherit;padding:11px;border:2px solid #b8cdea;border-radius:10px;margin:4px 0 10px;color:var(--navy);background:#fff}
textarea{min-height:110px}
label{font-size:13px;font-weight:700}
.pill{display:inline-block;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.it{padding:10px 0;border-top:1px solid #dbe6f5}
.it:first-of-type{border-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;color:#b9cdee;font-size:11px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;min-width:56px}
.nav button i{font-style:normal;font-size:19px}
.nav button.on{color:#f5b301}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const API="https://whkbtojcnftyrxlihlak.supabase.co/functions/v1/swift-task";
let tab="overview",D={},busy=false,err="",timer;
const F={q:"",ttitle:"",tdesc:"",tch:"",trew:"10",atitle:"",abody:"",alink:"",bc:""};
const $=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=x=>"₦"+Number(x||0).toLocaleString("en-NG");
function say(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>{e.hidden=true},3000)}
function ask(t,fn){if(tg&&tg.showConfirm)tg.showConfirm(t,ok=>{if(ok)fn()});else if(confirm(t))fn()}
async function call(action,extra){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action:action,initData:tg?tg.initData:""},extra||{}))}).then(x=>x.json());
  if(r.error)throw new Error(r.error);
  return r;
}
async function load(){
  busy=true;err="";render();
  try{
    if(tab==="overview")D.overview=await call("overview");
    if(tab==="withdrawals")D.wd=(await call("withdrawals")).list;
    if(tab==="users")D.users=(await call("users",{q:F.q})).list;
    if(tab==="content"){D.tasks=(await call("tasks")).list;D.ads=(await call("ads")).list}
  }catch(e){err=e.message==="not_admin"?"Admins only. Open this page from the bot with /admin.":"Could not load. Check your connection and retry."}
  busy=false;render();
}
async function doit(action,extra){
  if(busy)return;busy=true;render();
  try{
    const r=await call(action,extra);
    say(r.msg||"Done");
    if(r.ok!==false){
      if(action==="task_add"){F.ttitle=F.tdesc=F.tch="";F.trew="10"}
      if(action==="ad_add"){F.atitle=F.abody=F.alink=""}
      if(action==="broadcast")F.bc="";
    }
  }catch(e){say("Failed: "+e.message)}
  busy=false;load();
}
function go(t){tab=t;load();window.scrollTo(0,0)}
function vOverview(){
  const o=D.overview;if(!o)return"";
  return `<div class="grid">${[["Users",o.users],["New today",o.today],["Joined community",o.joined],["Referrals paid",o.referrals],["Pending withdrawals",o.pending+" • "+N(o.pendingSum)],["Total paid out",N(o.paidSum)],["Users are owed",N(o.owed)]].map(x=>`<div class="card"><span class="mute">${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>`;
}
function vWd(){
  return (D.wd||[]).map(w=>{
    const c=w.status==="paid"?"#15803d":w.status==="rejected"?"#b91c1c":"#b45309";
    return `<div class="card"><div class="row"><b class="grow">#${w.id} • ${N(w.amount)}</b><span class="pill" style="background:${c}">${esc(w.status)}</span></div><div>${esc(w.bank_name)} • <b>${esc(w.account_number)}</b></div><div>${esc(w.account_name)}</div><div class="mute">User ${w.user_id} • ${new Date(w.created_at).toLocaleString()}</div>${w.status==="pending"?`<div class="row" style="margin-top:8px"><button class="g grow" onclick="ask('Mark #${w.id} as paid?',()=>doit('wd_paid',{id:${w.id}}))">Paid</button><button class="r grow" onclick="ask('Reject #${w.id} and refund?',()=>doit('wd_reject',{id:${w.id}}))">Reject</button></div>`:""}</div>`;
  }).join("")||'<div class="card mute">No withdrawals yet.</div>';
}
function vUsers(){
  return `<div class="card"><label>Search by Telegram ID</label><input value="${esc(F.q)}" oninput="F.q=this.value" inputmode="numeric" placeholder="Leave empty for the latest 40"><button class="full" onclick="load()">Search</button></div>`+(D.users||[]).map(u=>`<div class="card"><b>${esc(u.first_name||"User")}</b> ${u.username?"@"+esc(u.username):""}<div class="mute">ID ${u.id} • ${u.joined_community?"joined":"not joined"}</div><div>Balance ${N(u.balance)} • Earned ${N(u.total_earned)}</div></div>`).join("");
}
function vContent(){
  const tl=(D.tasks||[]).map(t=>`<div class="it row"><div class="grow"><b>${esc(t.title)}</b><div class="mute">${esc(t.channel)} • ${N(t.reward)} • ${t.active?"active":"off"}</div></div><button class="${t.active?"r":"g"}" onclick="doit('task_toggle',{id:${t.id}})">${t.active?"Turn off":"Turn on"}</button></div>`).join("");
  const al=(D.ads||[]).map(a=>`<div class="it row"><div class="grow"><b>${esc(a.title)}</b><div class="mute">${a.active?"active":"off"}</div></div><button class="${a.active?"r":"g"}" onclick="doit('ad_toggle',{id:${a.id}})">${a.active?"Turn off":"Turn on"}</button></div>`).join("");
  return `<div class="card"><h3>Tasks</h3>${tl}</div>
<div class="card"><h3>Add task</h3><label>Title</label><input value="${esc(F.ttitle)}" oninput="F.ttitle=this.value" placeholder="Join Telegram Channel"><label>Description</label><input value="${esc(F.tdesc)}" oninput="F.tdesc=this.value" placeholder="Join channel and return to earn"><label>Channel (the bot must be admin there)</label><input value="${esc(F.tch)}" oninput="F.tch=this.value" placeholder="@channelname"><label>Reward (₦)</label><input value="${esc(F.trew)}" oninput="F.trew=this.value" inputmode="numeric"><button class="full g" onclick="doit('task_add',{title:F.ttitle,description:F.tdesc,channel:F.tch,reward:F.trew})">Add task</button></div>
<div class="card"><h3>Ads</h3>${al}</div>
<div class="card"><h3>Add ad</h3><label>Title</label><input value="${esc(F.atitle)}" oninput="F.atitle=this.value"><label>Text</label><input value="${esc(F.abody)}" oninput="F.abody=this.value"><label>Link (https://…)</label><input value="${esc(F.alink)}" oninput="F.alink=this.value"><button class="full g" onclick="doit('ad_add',{title:F.atitle,body:F.abody,link:F.alink})">Add ad</button></div>`;
}
function vBc(){
  return `<div class="card"><h3>Broadcast</h3><p class="mute">Sends a message to every user of the bot.</p><textarea oninput="F.bc=this.value" placeholder="Write your message">${esc(F.bc)}</textarea><button class="full" onclick="ask('Send this to all users?',()=>doit('broadcast',{text:F.bc}))">Send to all</button></div>`;
}
function render(){
  const tabs=[["overview","📊","Overview"],["withdrawals","💸","Payouts"],["users","👥","Users"],["content","🧩","Content"],["broadcast","📣","Message"]];
  const v={overview:vOverview,withdrawals:vWd,users:vUsers,content:vContent,broadcast:vBc}[tab]();
  const body=err?`<div class="card">${esc(err)}<br><br><button onclick="load()">Retry</button></div>`:(busy?'<p class="mute">Working…</p>':"")+v;
  $.innerHTML=`<div class="wrap"><h1>🦅 Eagle NGN Admin</h1>${body}</div><div class="nav">${tabs.map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join("")}</div>`;
}
load();
</script>
</body>
  </html>
